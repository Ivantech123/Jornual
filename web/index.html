<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Журнал преподавателя</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="page-header">
      <h1>Журнал преподавателя</h1>
      <p>Управляйте учениками, оценками и посещаемостью в браузере.</p>
    </header>

    <main class="layout">
      <section class="card">
        <h2>Список учеников</h2>
        <ul id="students-list" class="list"></ul>
      </section>

      <section class="card">
        <h2>Сводка</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ученик</th>
                <th>Средняя оценка</th>
                <th>Оценок</th>
                <th>Посещаемость</th>
                <th>Записей</th>
              </tr>
            </thead>
            <tbody id="summary-body"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <h2>Добавить ученика</h2>
        <form id="student-form" class="form">
          <label>
            ID ученика
            <input name="student_id" required />
          </label>
          <label>
            Имя
            <input name="name" required />
          </label>
          <button type="submit">Добавить</button>
        </form>
      </section>

      <section class="card">
        <h2>Оценка</h2>
        <form id="grade-form" class="form">
          <label>
            Ученик
            <select name="student_id" required></select>
          </label>
          <label>
            Предмет
            <input name="subject" required />
          </label>
          <label>
            Оценка
            <input name="grade" type="number" step="0.01" required />
          </label>
          <label>
            Дата
            <input name="date" type="date" />
          </label>
          <label>
            Заметка
            <input name="note" />
          </label>
          <button type="submit">Сохранить оценку</button>
        </form>
      </section>

      <section class="card">
        <h2>Посещаемость</h2>
        <form id="attendance-form" class="form">
          <label>
            Ученик
            <select name="student_id" required></select>
          </label>
          <label>
            Дата
            <input name="date" type="date" />
          </label>
          <label class="inline">
            <input type="radio" name="present" value="true" checked />
            Присутствовал
          </label>
          <label class="inline">
            <input type="radio" name="present" value="false" />
            Отсутствовал
          </label>
          <label>
            Заметка
            <input name="note" />
          </label>
          <button type="submit">Сохранить посещаемость</button>
        </form>
      </section>

      <section class="card">
        <h2>Отчет по ученику</h2>
        <div class="report-header">
          <label>
            Ученик
            <select id="report-student" required></select>
          </label>
          <button id="refresh-report" type="button">Обновить</button>
        </div>
        <div id="report-content" class="report-content"></div>
      </section>
    </main>

    <footer class="page-footer">
      <span id="status"></span>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
